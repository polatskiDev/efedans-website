<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>EfeDans İçerik Yönetimi</title>
  </head>
  <body>
    <!--
      Decap CMS admin entry point. Access is gated by Netlify Identity +
      Git Gateway (configure in the Netlify dashboard: Site settings >
      Identity > enable, then set registration to "Invite only" and enable
      Git Gateway). Do not make registration public.
    -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
